# ~/.pi-sandbox/config.yaml: the only file of pi-sandbox you edit.
#
#   pibox setup   generates every other configuration from this file (.env for docker compose, the
#                 bridge's environment, Pi's model list, Maven/Gradle/npm/pip/Docker settings, the VM)
#   pibox up      starts everything with those configurations
#
# Every setting below is shown with its default value. Change what you need; the rest can stay.
# `pibox init` (after `git pull` in the repository) rebuilds this file from the newest template and
# carries over every value you changed, so new settings and their explanations show up here too.
# Your own comments are not carried over; the previous file is kept as config.yaml.bak.
# More: docs/pi-setup.md §6.5.
#
# How the agent's traffic flows (both arrows go through the VM's network to the outside):
#
#   Pi ──► bridge (holds the API key) ─────────────────────► [proxy on your Mac] ──► your model router
#   Pi, git, mvn, npm, curl… ──► proxy (filters, asks you) ─► [proxy on your Mac] ──► web, artifact repository
#
# The agent's container has no other way out: it is only on an internal network with these two.

# ======================================================================================== folders
# The only folders of your Mac the agent sees: absolute paths. Inside the container they have the
# same paths as on the Mac. Both are writable for the agent, except <vault>/.obsidian (read-only).
# Avoid ~/Documents and ~/Desktop: macOS protects them, and mounts of them behave unpredictably.
folders:
  # Your code: the agent works in subfolders of it (`cd ~/Projects/api && pibox run`)
  projects: /Users/you/Projects
  # Your Obsidian vault: the agent can read and write notes
  vault: /Users/you/Notes/Main Vault

# ========================================================================================= bridge
# The pi-text bridge: Pi talks to it, it talks to your model router and turns Pi's tool calls into
# text the router accepts. These are its environment variables, passed to it as they are. Only the
# bridge's container gets them; the agent never sees the key. Every variable the bridge knows is
# in bridge/README.md, "Configuration". A map or list value is passed as JSON.
bridge:
  # Your router's OpenAI-compatible API: a base URL ending in /v1, or a full endpoint
  # (…/chat/completions, …/responses)
  PI_TEXT_URL: https://router.example.com/v1
  # Your router's API key, sent as "Authorization: Bearer <key>"
  PI_TEXT_KEY: YOUR_KEY
  # A readable trace of every turn: "-" = into the bridge's log (`docker logs` of the bridge
  # container), "" = off
  TRACE: "-"
  # Example: extra fields for every request to the router; for OpenRouter, pin the provider:
  # UPSTREAM_EXTRA_BODY: { provider: { only: [wafer/fp8], allow_fallbacks: false } }
  # Rate limits (defaults shown): the bridge spaces its requests, waits out a 429 until the reset the
  # router names (Pi stays connected meanwhile) and sends the request again
  # MIN_REQUEST_INTERVAL: 1        # seconds between two requests to the router, 0 = off
  # RATE_LIMIT_MAX_WAIT: 180       # most seconds one request may wait; then Pi gets the 429
  # Models the router refuses as "unsupported": use these instead. `pibox probe` shows which work
  # MODEL_FALLBACKS: { YOUR_MODEL_ID: [ANOTHER_MODEL_ID] }

# ========================================================================================= models
# The models Pi offers you (`/model` in Pi). Each model has its own entry and its own limits.
#   id             the model name exactly as your router expects it (forwarded unchanged)
#   contextWindow  the model's context window in tokens: Pi compacts (summarizes) the conversation
#                  before it fills up. Take the real value from your router
#   maxTokens      the most tokens the model may write in ONE reply. A file the agent writes is part
#                  of a reply, so too little cuts big write/edit calls off. Must fit into contextWindow
#                  A thinking model's reasoning counts too: give it 32768 or more, or the reply is
#                  cut off mid-sentence (pibox diag shows "CUT OFF")
# Optional:
#   reasoning: true    for thinking models (gpt-oss, Qwen3 thinking…): Pi shows a thinking level
#   name               shown in Pi; default "<id> (sandbox)"
#   cost               prices per million tokens, for Pi's cost display; default 0
#   compat             overrides of Pi's API options for this model only, e.g.
#                      { supportsReasoningEffort: true } if the router accepts reasoning_effort
# Any other field of Pi's models.json works too (bridge/README.md, "Configuring Pi").
models:
  - id: YOUR_MODEL_ID
    contextWindow: 32768
    maxTokens: 8192
  # - id: YOUR_REASONING_MODEL_ID
  #   reasoning: true
  #   contextWindow: 131072
  #   maxTokens: 32768
  #   compat: { supportsReasoningEffort: true }

# ======================================================================================== network
network:
  # The port the bridge listens on. Only inside the sandbox's internal Docker network: Pi reaches
  # it as http://bridge:<port>/v1. It is NOT opened on your Mac or your LAN and can't conflict
  # with anything there; there is normally no reason to change it.
  bridge_port: 8789

  # The port of the filtering proxy (mitmproxy), also only inside the internal network. Every web
  # request of the agent and its tools goes to http://proxy:<port>: it lets GET requests through
  # after your approval (`pibox approve`) and refuses everything else (§8.6). Not opened on your
  # Mac either; normally no reason to change it.
  proxy_port: 8080

  # NOT a part of the sandbox: the port of the HTTP proxy that runs on your Mac, through which
  # everything leaves the sandbox: the bridge (to your model router), the filtering proxy (the
  # agent's allowed requests), image builds and the VM's Docker. Only the port: pibox fills in
  # the Mac's address as the VM sees it. A proxy listening on the Mac's 127.0.0.1 is fine.
  # `pibox check` tests that something listens on it. "" = no proxy, connect directly.
  mac_proxy_port: ""

  # Hosts reached directly although mac_proxy_port is set, e.g. an artifact repository in your
  # network that the proxy can't reach. A name also covers its subdomains: localcorp, .localcorp
  # and *.localcorp all mean localcorp and everything under it. No other patterns, ports or URLs.
  upstream_no_proxy: []

  # Your company's CA certificates, for HTTPS signed by your company (Artifactory, a proxy that
  # inspects TLS): the images (pip, npm, Maven, Gradle, git, curl), the VM's Docker and the agent's
  # Docker engine trust them besides the public ones. "" = the certificates in this Mac's System
  # keychain, where your IT installs them; or the path of a PEM file; off = only the public CAs.
  ca_certs: ""

  # The address range of the sandbox's internal Docker network. Change it only if it overlaps with
  # a network you need (your LAN, VPN): its addresses would be unreachable from the sandbox.
  sandbox_subnet: 172.30.0.0/24

# ========================================================================================= egress
# What the filtering proxy lets the agent fetch from the web (docs/pi-setup.md §8.6). Only GET and
# HEAD ever pass; uploads (POST, PUT…) and encrypted tunnels are always refused. Every host in these
# lists also covers its subdomains (repo.corp, .corp and *.corp all work the same way; no other
# patterns). `pibox log` shows every decision.
egress:
  # Hosts on private addresses (LAN, VPN) the agent may still fetch from. Every other private
  # address is refused, so the agent can't reach your router, NAS, intranet. Your repositories
  # (the repository section) are added automatically.
  allow_private: []
  # Hosts allowed without asking you each time. Every other request waits until you allow it in
  # `pibox approve`. Your repositories are added automatically, so builds don't wait.
  no_approval: []
  # If not empty, ONLY these hosts are reachable; everything else is refused without asking.
  allow_only: []
  # Always refused, even if you would approve: services made for uploading data.
  deny: [pastebin.com, transfer.sh, 0x0.st]
  # Allowed ports. Your repositories' ports are added automatically.
  ports: [80, 443]

# ===================================================================================== extensions
# Pi extensions of the sandbox (docs/pi-setup.md §9).
extensions:
  # Which bash commands of the agent need your OK in Pi:
  #   risky  network tools, rm -rf, sudo/chmod, git push, paths in your home or /etc…
  #   all    every command
  #   off    none (the container's limits still apply)
  bash_approval: risky
  # The web tools send https:// pages to the proxy as plain http:// requests, so the proxy can see
  # and check them (it refuses encrypted tunnels). false = they use tunnels and get refused.
  web_plain_http: true
  # The web_search tool: URL of a SearXNG instance the proxy can reach; "" = DuckDuckGo
  searxng: ""
  # The most characters web_fetch returns of one page (the rest is cut off)
  fetch_max_chars: 20000

# ===================================================================================== repository
# Where the agent downloads its dependencies from (Artifactory, Nexus…): the configuration files
# you already use on your Mac, with any number of repositories, mirrors and logins. `pibox setup`
# copies them (the VM doesn't see your home folder) and changes only what can't work in the
# sandbox (docs/pi-setup.md §8.9):
#   - everything goes through the filtering proxy; URLs stay as they are (https:// included);
#   - your own proxy settings and paths of your Mac are dropped;
#   - every repository host is added to the egress lists (`pibox setup` lists them): reachable
#     without asking you, also if it's in your network, and over HTTPS: the filter allows encrypted
#     tunnels to these hosts alone (it can't check what goes through them, so: read-only tokens).
# Without a file, the tool gets only the filtering proxy and can't download anything: the public
# servers answer HTTPS only. Paths are absolute or ~/…. The agent can read these copies,
# credentials included: use READ-ONLY tokens.
repository:
  # Maven's settings.xml, e.g. ~/.m2/settings.xml: mirrors, profiles, <servers> logins. Its
  # <proxies>, <localRepository> and <offline> are dropped. Encrypted passwords ({…}) don't work in
  # the sandbox. Gradle gets the same repositories: those of the active profiles and Maven Central,
  # each through the mirror whose mirrorOf matches it, with the login of the <server> of the same
  # id; plugins from the pluginRepositories and the same list. The Maven wrapper (./mvnw) downloads
  # Maven from Central's mirror.
  maven_settings: ""
  # npm's .npmrc, e.g. ~/.npmrc: registries, scopes, tokens. Its proxy settings and Mac paths
  # (cafile, prefix, cache) are dropped. Installing Pi into the image uses it too (mounted for
  # that step only: the token doesn't stay in the image); corepack (pnpm, yarn) its registry=.
  npmrc: ""
  # pip's pip.conf, e.g. the one Artifactory's "Set Me Up" generates: index-url, extra-index-url,
  # credentials in the URL. Its proxy, cert and Mac paths are dropped; http:// index hosts are
  # trusted (pip refuses plain http otherwise). Building the bridge's image uses it too (mounted
  # for that step only). pip reads the URLs itself: they are never taken apart or rewritten.
  pip_conf: ""
  # A daemon.json for the agent's own Docker engine (agent_docker), e.g. with your registry-mirrors
  # (where `docker pull postgres:16` and Testcontainers get Docker Hub images) and
  # insecure-registries. hosts, tls*, data-root are dropped, the proxy is the filtering proxy,
  # http:// mirrors are added to insecure-registries. Its mirrors are used by the VM's Docker too
  # (building and pulling the sandbox's images).
  docker_daemon: ""
  # The docker CLI's config.json, e.g. ~/.docker/config.json: the logins ("auths") for your
  # registries, so the agent can pull e.g. registry.corp:5000/team/app. Only entries with the
  # login in the file ("auth", or username/password) are kept: credsStore/credHelpers keep it in
  # your Mac's keychain, which the sandbox doesn't have.
  docker_config: ""
  # Debian packages for building the agent's image (images.base: Debian 12 "bookworm"): a file
  # with the lines your Artifactory's "Set Me Up" gives for its Debian remotes, as they are, e.g.
  # ~/.config/pi-sandbox/apt-sources:
  #   deb https://user:token@artifactory.corp/artifactory/debian-remote <DISTRIBUTION> <COMPONENT>
  #   deb https://user:token@artifactory.corp/artifactory/debian-security-remote <DISTRIBUTION> <COMPONENT>
  # One line per remote: of deb.debian.org/debian, and, if you have one, of
  # deb.debian.org/debian-security (without it the image gets no security fixes released after
  # Debian's last point release: its newer packages are brought to your remote's versions);
  # "deb" may be left out; any <…> placeholder. pibox setup asks each remote which of bookworm,
  # bookworm-updates, bookworm-security it has with packages for this Mac's architecture (arm64
  # on Apple Silicon: Debian keeps all architectures in the same archive), and uses exactly those;
  # <COMPONENT> becomes main. The login is used for the build only and doesn't stay in the image.
  # "" = deb.debian.org
  apt_sources: ""

# ========================================================================================= images
# The images the sandbox is built from, all pulled from your registry (registry below): nothing
# is fetched from Docker Hub itself.
images:
  # The registry all of them come from: your Artifactory's Docker remote of Docker Hub, as
  # host[:port][/path] (e.g. docker.artifactory.corp, or artifactory.corp/docker-remote).
  # pibox puts it in front of the Docker Hub names below: node:24-… becomes
  # <registry>/library/node:24-…; a name that already starts with a registry stays as it is.
  # "" = the host of the first registry-mirrors entry of your daemon.json (repository.docker_daemon)
  registry: ""
  base: debian:bookworm-slim               # the agent's image: Debian 12 (bookworm); ubuntu:24.04 works too
  node: node:24-bookworm-slim              # Node.js (node, npm, corepack) is copied from this
  python: python:3.12-slim                 # base of the bridge's image
  mitmproxy: mitmproxy/mitmproxy:12.3.1    # the filtering proxy
  jdk17: eclipse-temurin:17-jdk            # JDKs copied into the agent's image
  jdk21: eclipse-temurin:21-jdk
  jdk25: eclipse-temurin:25-jdk
  maven: maven:3-eclipse-temurin-21        # Maven and Gradle are copied from these
  gradle: gradle:jdk21
  docker_cli: docker:29-cli                # docker CLI and compose for the agent
  dind: docker:29-dind                     # the agent's own Docker engine

# ============================================================================================= pi
# The agent's image and container
pi:
  # Pi's npm package, optionally with a version: "@earendil-works/pi-coding-agent@1.5.0"
  package: "@earendil-works/pi-coding-agent"
  # Debian packages installed into the agent's image: the tools it can use
  apt_packages: [bash, ca-certificates, curl, git, ripgrep, fd-find, jq, httpie, unzip, zip, less, procps,
                 build-essential, python3, python3-dev, python3-venv, python3-pip]
  # The JDK on PATH: 17, 21 or 25 (`jdk 17 mvn …` runs one command with another)
  java_default: 21
  # Limits of the agent's container: memory, CPUs, number of processes
  memory: 8g
  cpus: 4
  pids: 4096

# =================================================================================== agent_docker
# The agent's own Docker engine, so it can use docker, Docker Compose and Testcontainers
# (docs/pi-setup.md §8.10). It runs in its own container, on the internal network only.
agent_docker:
  # privileged  the engine runs as a privileged container in the VM. Works everywhere. The agent can
  #             then become root in the VM (not on your Mac): it could read the bridge's key and
  #             reach the network without the filtering proxy (through the proxy on your Mac)
  # sysbox      the engine runs under the sysbox runtime, without a privileged container: the agent
  #             can't take over the VM. Needs the sysbox-ce .deb (sysbox_deb_url); `pibox up`
  #             installs it into the VM once
  # off         no Docker for the agent (no Testcontainers, no docker compose)
  mode: privileged
  # For mode sysbox: the sysbox-ce .deb for the VM (arm64 on Apple Silicon), its URL or the path
  # of the file on this Mac
  sysbox_deb_url: ""
  # The addresses of the networks the agent's containers get. Change it only if it overlaps with
  # a network you need (LAN, VPN).
  address_pool: 172.31.0.0/16
  # The oldest Docker API version the engine accepts; 1.24 lets old clients (Testcontainers 1.x) work
  min_api_version: "1.24"

# ============================================================================================= vm
# The Colima VM everything runs in. It sees only the two folders above and ~/.pi-sandbox.
# A change takes effect after `pibox setup` and `pibox down --vm && pibox up`.
vm:
  # Colima's profile name: `colima list` shows it, the Docker context is colima-<profile>
  profile: pi
  # CPUs, memory in GB, disk in GB (the disk can only grow)
  cpus: 6
  memory: 12
  disk: 100
  # A Colima disk image file to start from, if Colima can't download its own; "" = Colima's
  disk_image: ""

# ============================================================================================ mac
# Your user and group id on the Mac: files the agent creates in your folders belong to you.
# "" = detected (`id -u`, `id -g`); set them only if pibox runs as a different user.
mac:
  uid: ""
  gid: ""
